decisions:
  - pglite_over_sqlite: PGlite gives full Postgres, pgvector path for Phase 2, zero-config for localhost
  - no_tanstack_db: TanStack DB maintainers confirmed PGlite overlap. Replaced with PGlite useLiveQuery for reactivity
  - no_agentic_framework: Pipeline is deterministic chain (not agent loop). Vercel AI SDK with plain TS orchestration
  - zustand_for_ui: Zustand + Zundo for undo/redo and ephemeral UI state. PGlite for persistent data
  - provider_aware_scoring: Ollama N=1 sequential, cloud APIs N=3 parallel (9 concurrent calls)
  - lock_fidelity_retry: Single grammar layer retry with deviation feedback when locks drift
  - functional_first_chart: Chart.js + chartjs-plugin-dragdata. Radar drag confirmed radial-only (correct for our use)
  - vercel_ai_sdk: generateObject() with Zod for structured output, streamText() for grammar layer, multi-provider via @ai-sdk/* packages

findings:
  - chartjs_dragdata_works: Radar chart dragging is radial-only (constrained to axis). Lock = return false from onDragStart. Compatible with Chart.js v4
  - tanstack_db_beta: v0.5.31 beta, no official PGlite adapter, maintainers said integration "may not make much sense"
  - pglite_reactive: useLiveQuery from @electric-sql/pglite-react provides reactive queries without TanStack DB
  - zustand_middleware_order: Must nest devtools -> persist -> temporal -> immer (outside to inside). Two partialize fns needed

