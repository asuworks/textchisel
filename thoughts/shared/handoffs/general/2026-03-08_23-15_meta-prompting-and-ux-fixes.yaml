findings:
  - root_cause_prompt_quality: "Dimension generation hardcoded quality scale ('1=poor, 5=excellent') which corrupted all downstream evaluation and rewriting. Fixed with operational rubric examples."
  - rewrite_mode_missing_scale: "Rewrite path only showed target level description, not full 1-5 scale. Initial generation path showed full scale. Asymmetry fixed."
  - stale_scores_on_edit: "Editing dimension rubric left stale evaluation scores in store. Rewriter showed old 'Current assessment' from previous rubric. Fixed by clearing scores on dimension edit."
  - chart_layers_backwards: "Current scores were drawn on top (order:1) blocking target drag. Swapped: target=foreground, current=background with hitRadius:0."

