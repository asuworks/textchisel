questions:
  - "RewriteContext.lockedDimensionIds in shared/types.ts still uses Set<string> — internal APIs (rewriter, orchestrator) kept Set for natural API. Conversion at boundary in App.tsx via lockedIds() helper. Is this OK or should we change all internal APIs too?"

decisions:
  - shadcn_style: "base-nova style with neutral base color — clean, minimal"
  - locked_dims_boundary: "Store uses Record<string,boolean> (JSON-safe), internal APIs keep Set<string>, conversion at App.tsx boundary via lockedIds() helper"
  - dimension_limit: "12 dimensions max, no warnings (user decision)"
  - manual_refine: "Keep manual Refine button, no auto-refine on chart drag (user decision)"
  - defer_useLiveQuery: "Manual sync from PGlite for now, add useLiveQuery later if reactivity gaps emerge"
  - no_dark_mode_mvp: "shadcn supports it but deferred"

findings:
  - state_consolidation: "App.tsx had 7 useState hooks for business state, all moved to Zustand. Zero useState for business state now."
  - orphaned_fields_removed: "systemPrompt, userTemplate, activeSessionId were defined in store but unused by UI — removed"
  - set_serialization: "Set<string> is not JSON-serializable, Zustand persist with createJSONStorage silently drops it. Record<string,boolean> fixes this."
  - shadcn_tw4: "shadcn@4.0.2 works with Tailwind v4 out of the box — auto-detected during init"

worked:
  - "Direct implementation (not agent delegation) for focused UI work"
  - "Installing all shadcn components upfront to avoid per-phase install friction"
  - "Boundary conversion pattern for Set→Record (keeps internal API clean, store JSON-safe)"

