questions:
  - ESLint/Prettier not yet configured (deferred, not blocking)
  - PGlite runs in browser (idb://) — server is purely LLM proxy. Confirm this is correct architecture.

decisions:
  - eight_modules: Split pipeline into dimensions/evaluation/rewriter/orchestrator for independent testability and extension
  - tailwind_v4: Vite plugin, no config file, @import "tailwindcss" in CSS
  - vitest_jsdom: Native Vite integration, @testing-library/react for component tests
  - bundler_resolution: Both client and server use bundler moduleResolution (tsx handles server at runtime)
  - skip_phase1: Exploration risks already mitigated by oracle research during Discovery
  - combine_phase2_3: Small project, contracts defined inline with scaffold

findings:
  - pglite_version_pin: pglite-react@0.2.33 requires pglite@0.3.15, not ^0.2.0
  - tsconfig_composite_noemit: composite:true + noEmit:true conflicts in TS project references; use emitDeclarationOnly instead
  - server_bundler_resolution: NodeNext moduleResolution requires .js extensions in imports; bundler resolution avoids this since tsx handles execution

worked:
  - Writing all config files first, then source files, then npm install — efficient batching
  - Defining contracts (shared/) before module skeletons — types available immediately
  - Raw SQL migration string in db/index.ts — simple, no drizzle-kit CLI dependency in browser

